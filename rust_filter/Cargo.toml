[package]
name = "crowdsec_filter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
proxy-wasm = "0.2.3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
flexbuffers = "25.2.10"
uuid = {version = "1.17.0", features = ["v4"]}
log = "0.4"
iprange = "0.6.3"
ipnet = { version = "2.8", features = ["serde"] }
rustc-hash = "1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "debuginfo"