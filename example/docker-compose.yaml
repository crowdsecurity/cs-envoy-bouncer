version: '3'
services:
  envoy:
    image: envoyproxy/envoy:debug-v1.34-latest
    environment:
      - ENVOY_UID=0
      - ENVOY_GID=0
      - ENVOY_LOG_LEVEL=debug
    user: root
    depends_on:
      - crowdsec
    ports:
      - "10000:10000"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
      - ./../filter/target/wasm32-wasip1/release/deps/crowdsec_filter.wasm:/etc/envoy/crowdsec_filter.wasm
      - ./../updater/target/wasm32-wasip1/release/deps/crowdsec_updater.wasm:/etc/envoy/crowdsec_updater.wasm
      - ./certs:/etc/envoy/certs:ro
    command: >
      envoy -c /etc/envoy/envoy.yaml --concurrency 2 --log-level debug
  openresty:
    image: openresty/openresty:alpine
    volumes:
      - ./nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    ports:
      - "8080:80"
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    environment:
      - BOUNCER_KEY_envoy2=thisisabouncerkey
      - COLLECTIONS=crowdsecurity/appsec-virtual-patching
    volumes:
      - crowdsec-db:/var/lib/crowdsec/data/
      - crowdsec-config:/etc/crowdsec/
      - /var/log/:/logs:ro
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml

volumes:
  crowdsec-db:
  crowdsec-config: